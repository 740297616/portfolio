<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- FOUC 防护：首次 paint 前确定主题；与 src/stores/theme.ts 保持同步 -->
    <script>
      ;(() => {
        try {
          var saved = localStorage.getItem('theme')
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = saved === 'light' || saved === 'dark' ? saved : dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a0a0a' : '#ffffff')
        } catch (err) {
          document.documentElement.dataset.theme =
            window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
      })()
    </script>

    <!-- 主 meta，与 src/config/site.ts 保持同步 -->
    <title>Lydia Studio — 全栈开发者</title>
    <meta
      name="description"
      content="专注于 AI 与现代 Web 技术的独立开发者工作室,构建快速、优雅、可靠的产品。"
    />
    <meta
      name="keywords"
      content="全栈开发者, AI 应用, Vue, TypeScript, 开发者工作室, Web 开发, full-stack developer"
    />
    <meta name="author" content="Lydia Studio" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://lydia0.cn/" />

    <!-- Open Graph -->

      content="专注于 AI 与现代 Web 技术的独立开发者工作室。"
    />
    <meta property="og:url" content="https://lydia0.cn/" />
    <meta property="og:image" content="https://lydia0.cn/og.png" />

    <meta property="og:image:height" content="630" />
